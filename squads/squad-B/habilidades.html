<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Habilidades - Squad B</title>
  <link rel="stylesheet" href="styles/habilidades.css">
  <link rel="stylesheet" href="styles/chat.css">
</head>
<body>
  <!-- Navegação principal da página de habilidades. -->
  <header>
    <div class="nav-bar">
      <nav>
        <div class="menu">
          <ul>
            <li><a class="pag-home" href="home.html">Home</a></li>
            <li><a class="pag-home" href="sobre.html">Sobre</a></li>
            <li><a class="pag-home" href="contato.html">Contato</a></li>
            <li><a class="pag-home" href="projetos.html">Projetos</a></li>
            <li><a class="pag-home" href="servicos.html">Serviços</a></li>
            <li><a class="pag-ativa" href="habilidades.html">Skills</a></li>
            <li><a class="pag-home" href="depoimentos.html">Depoimentos</a></li>
            <li><a class="pag-home" href="case-de-sucesso.html">Case de Sucesso</a></li>
          </ul>
        </div>
      </nav>
    </div>
  </header>
  
  <!-- Conteúdo principal: apresenta as ferramentas dominadas pelo squad. -->
  <main>
    <section class="intro">
      <h2>Nossas Skills</h2>
      <p>Algumas das ferramentas nas quais somos bons</p>
    </section>

    <!-- Cada item reúne os dados de uma skill; o CSS decide apenas sua aparência. -->
    <section class="skills-list" aria-label="Ferramentas conhecidas pelo squad">
      <article class="skill-card skill-card--css" data-skill="css">
        <img src="svg/css-brands-solid-full.svg" class="skills-logo" alt="Ícone CSS">
        <h3>CSS</h3>
      </article>

      <article class="skill-card skill-card--html" data-skill="html">
        <img src="svg/html5-brands-solid-full.svg" class="skills-logo" alt="Ícone HTML">
        <h3>HTML</h3>
      </article>

      <article class="skill-card skill-card--javascript" data-skill="javascript">
        <img src="svg/js-brands-solid-full.svg" class="skills-logo" alt="Ícone JavaScript">
        <h3>JavaScript</h3>
      </article>

      <article class="skill-card skill-card--figma" data-skill="figma">
        <img src="svg/figma-brands-solid-full.svg" class="skills-logo" alt="Ícone Figma">
        <h3>Figma</h3>
      </article>

      <article class="skill-card skill-card--java" data-skill="java">
        <img src="svg/java-brands-solid-full.svg" class="skills-logo" alt="Ícone Java">
        <h3>Java</h3>
      </article>

      <article class="skill-card skill-card--node" data-skill="node">
        <img src="svg/node-js-brands-solid-full.svg" class="skills-logo" alt="Ícone Node.js">
        <h3>Node.js</h3>
      </article>

      <article class="skill-card skill-card--python" data-skill="python">
        <img src="svg/python-brands-solid-full.svg" class="skills-logo" alt="Ícone Python">
        <h3>Python</h3>
      </article>

      <article class="skill-card skill-card--react" data-skill="react">
        <img src="svg/react-brands-solid-full.svg" class="skills-logo" alt="Ícone React">
        <h3>React.js</h3>
      </article>
    </section>
  </main>

  <script src="chat.js"></script>
</body>
</html>

<!-- Página de contato do Squad B. -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contato - Squad B</title>
  <link rel="stylesheet" href="styles/contato.css" />
  <link rel="stylesheet" href="styles/chat.css" />
</head>
<body>
  <!-- A navegação permite acessar as principais áreas do squad. -->
  <header class="cabecalho">
    <nav class="menu-principal" aria-label="Navegação principal">
      <ul>
        <li><a href="home.html">Home</a></li>
        <li><a href="sobre.html">Sobre</a></li>
        <li><a href="contato.html" aria-current="page">Contato</a></li>
        <li><a href="projetos.html">Projetos</a></li>
        <li><a href="servicos.html">Serviços</a></li>
        <li><a href="habilidades.html">Skills</a></li>
        <li><a href="depoimentos.html">Depoimentos</a></li>
        <li><a href="case-de-sucesso.html">Case de Sucesso</a></li>
      </ul>
    </nav>
  </header>

  <main class="conteudo-principal">
    <!-- Bloco de apresentação e canais diretos de contato. -->
    <section class="apresentacao-contato" aria-labelledby="titulo-contato">
      <h1 id="titulo-contato">Vamos conversar!</h1>
      <h2>Encaminhe sua mensagem para nós.</h2>
      <p>Vamos criar algo juntos.</p>

      <div class="canais-contato" aria-label="Canais de contato">
        <a class="canal-contato canal-email" href="https://workspace.google.com/intl/pt-BR/gmail/" aria-label="Enviar e-mail">
          <span aria-hidden="true">@</span>
        </a>
        <a class="canal-contato canal-whatsapp" href="https://web.whatsapp.com/" aria-label="Conversar pelo WhatsApp">
          <span aria-hidden="true">W</span>
        </a>
      </div>
    </section>

    <!-- O formulário coleta os dados necessários para iniciar o atendimento. -->
    <form class="formulario-contato" action="home.html">
      <h1>Envie-nos uma mensagem:</h1>

      <div class="grupo-formulario">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" required />
      </div>

      <div class="grupo-formulario">
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required />
      </div>

      <div class="grupo-formulario">
        <label for="assunto">Assunto:</label>
        <input type="text" id="assunto" name="assunto" required />
      </div>

      <div class="grupo-formulario">
        <label for="mensagem">Mensagem:</label>
        <textarea id="mensagem" name="mensagem" required></textarea>
      </div>

      <!-- As ações ficam agrupadas para facilitar o uso e a manutenção. -->
      <div class="acoes-formulario">
        <button class="botao-enviar" type="submit">Enviar</button>
        <button class="botao-cancelar" type="reset">Cancelar</button>
      </div>
    </form>
  </main>

  <!-- Rodapé com a informação institucional da página. -->
  <footer class="rodape">
    <p>&copy; 2025 Squad B. Todos os direitos reservados.</p>
  </footer>
  <script src="chat.js"></script>
</body>
</html>
